version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: cognivus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cognivus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cognivus_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-cognivus_auth}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cognivus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognivus_user} -d ${POSTGRES_DB:-cognivus_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB - Time-Series Database for Vitals
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: cognivus_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-timescale_user}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-timescale_secure_password_123}
      POSTGRES_DB: ${TIMESCALE_DB:-cognivus_vitals_timeseries}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init_timescaledb.sql:/docker-entrypoint-initdb.d/init_timescaledb.sql
    ports:
      - "5433:5432"
    networks:
      - cognivus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-timescale_user} -d ${TIMESCALE_DB:-cognivus_vitals_timeseries}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognivus_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      SPO2_MODEL_PATH: /app/ml-models/spo2-prediction/model/model_medium.keras
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./init_db.py:/app/init_db.py
      - ../../ml-models:/app/ml-models:ro
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - cognivus_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL to be ready...' &&
        sleep 5 &&
        echo 'Waiting for TimescaleDB to be ready...' &&
        sleep 3 &&
        echo 'Initializing database...' &&
        python init_db.py &&
        echo 'Starting FastAPI server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # PgAdmin - PostgreSQL Administration ATool (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cognivus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cognivuslabs.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - cognivus_network

networks:
  cognivus_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  timescale_data:
    driver: local
  pgadmin_data:
    driver: local
