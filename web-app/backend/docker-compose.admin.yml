version: '3.8'

services:
  # PostgreSQL Database (shared with main system)
  postgres:
    image: postgres:15-alpine
    container_name: cognivus-postgres-admin
    environment:
      POSTGRES_USER: cognivus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cognivus_health
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_admin_data:/var/lib/postgresql/data
    networks:
      - admin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognivus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin - Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cognivus-pgadmin-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cognivuslabs.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5051:80"  # Different port
    volumes:
      - pgadmin_admin_data:/var/lib/pgadmin
    networks:
      - admin-network
    depends_on:
      - postgres

  # Backend API (Admin Only)
  backend-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognivus-backend-admin
    environment:
      SECRET_KEY: ${SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: cognivus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cognivus_health
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      DEBUG: "True"
    ports:
      - "8001:8000"  # Different port for admin backend
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    networks:
      - admin-network
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache (for admin sessions)
  redis-admin:
    image: redis:7-alpine
    container_name: cognivus-redis-admin
    ports:
      - "6380:6379"  # Different port
    volumes:
      - redis_admin_data:/data
    networks:
      - admin-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_admin_data:
    driver: local
  pgadmin_admin_data:
    driver: local
  redis_admin_data:
    driver: local

networks:
  admin-network:
    driver: bridge
    name: cognivus-admin-network
